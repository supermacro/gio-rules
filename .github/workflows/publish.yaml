name: Publish jdm-editor
on:
  push:
    tags:
      - 'giorules-jdm-editor@*'

permissions:
  contents: read

jobs:
  publish-jdm-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: true

      - name: Build
        run: pnpm build

      - name: Verify tag matches package version
        working-directory: packages/jdm-editor
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#giorules-jdm-editor@}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match packages/jdm-editor version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish giorules-jdm-editor
        working-directory: packages/jdm-editor
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
